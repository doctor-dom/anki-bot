name: NightBot

on:
  schedule:
    # 2:00 AM US Eastern (EST/EDT via IANA timezone)
    - cron: "0 2 * * *"
      timezone: America/New_York
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install anki-bot
        run: pip install -e .

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf

      - name: Pull input and output from Google Drive
        env:
          RCLONE_REMOTE: gdrive
        run: |
          mkdir -p input output
          rclone copy "${RCLONE_REMOTE}:anki-bot/input" ./input
          rclone copy "${RCLONE_REMOTE}:anki-bot/output" ./output || true

      - name: Run anki-bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: auto
          ANKI_BOT_PDF_MODE: auto
          ANKI_BOT_PNG_MODE: auto
          ANKI_BOT_PNG_KEEP_OCR: "1"
          ANKI_BOT_GEMINI_TIMEOUT_S: "180"
          ANKI_BOT_RUN_BUDGET_MINUTES: "300"
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          anki-bot run 2>&1 | tee run.log

      - name: Push output to Google Drive
        if: always()
        env:
          RCLONE_REMOTE: gdrive
        run: rclone sync ./output "${RCLONE_REMOTE}:anki-bot/output"

      - name: Job summary
        if: always()
        run: |
          echo "## NightBot" >> "$GITHUB_STEP_SUMMARY"
          if [ -f run.log ]; then
            tail -n 40 run.log >> "$GITHUB_STEP_SUMMARY"
          fi
