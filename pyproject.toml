[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anki-bot"
version = "0.1.0"
description = "Screenshot question OCR review and Anki cloze card generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0.0",
    "genanki>=0.13.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
anki-bot = "anki_bot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["anki_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
